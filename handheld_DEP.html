<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DEP Monitor</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #666; --card: #f3f4f6; --line: #d0d4da;
    --accent: #2563eb; --band: #f59e0b; --ok: #16a34a; --bad: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111315; --fg: #eceef0; --muted: #9aa0a6; --card: #1c1f23; --line: #343a41;
      --accent: #60a5fa; --band: #fbbf24; --ok: #4ade80; --bad: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top, 0px) 14px env(safe-area-inset-bottom, 0px);
  }
  h1 { font-size: 1.25rem; margin: 14px 0 10px; }
  h2 { font-size: 1rem; margin: 14px 0 6px; color: var(--muted); font-weight: 600; }
  .card { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button, select, input {
    font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg);
  }
  button { flex: 1 1 auto; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
  button:disabled { opacity: .45; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button { border-radius: 10px; }
  .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--bad); margin-right: 6px; }
  .dot.on { background: var(--ok); }
  #state { font-weight: 600; }
  #stage { font-size: 1.3rem; font-weight: 600; margin-top: 6px; font-variant-numeric: tabular-nums; }
  #bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  #barfill { height: 100%; width: 0%; background: var(--accent); transition: width .4s; }
  canvas { width: 100%; height: 300px; display: block; background: var(--bg); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  #log { font: 12px/1.4 ui-monospace, Menlo, monospace; color: var(--muted); max-height: 120px; overflow-y: auto; white-space: pre-wrap; }
  .small { color: var(--muted); font-size: .85rem; }
  .field { display: grid; grid-template-columns: 1fr 110px 40px; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .field:last-child { border-bottom: none; }
  .field input { width: 100%; text-align: right; }
  .field .unit { color: var(--muted); font-size: .9rem; }
  .field .help { grid-column: 1 / -1; color: var(--muted); font-size: .8rem; margin-top: -4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1>DEP Monitor</h1>

<div class="card">
  <div class="row">
    <button id="connectBtn" class="primary">Connect</button>
  </div>
  <p style="margin:10px 0 0"><span class="dot" id="dot"></span><span id="state">Not connected</span></p>
</div>

<div class="tabs">
  <button id="tabRun" class="active">Run</button>
  <button id="tabSettings">Settings</button>
</div>

<!-- ============ RUN TAB ============ -->
<section id="runPane">
  <div class="card">
    <div class="row">
      <button id="startBtn" class="primary" disabled>Start run</button>
      <button id="stopBtn" class="danger" disabled>Stop</button>
    </div>
    <div id="stage">Idle</div>
    <div id="bar"><div id="barfill"></div></div>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:8px">
      <label class="small" for="metric">Plot:</label>
      <select id="metric">
        <option value="R">Resistance</option>
        <option value="dR">Change in resistance (%)</option>
        <option value="I">Current</option>
      </select>
      <span class="small" id="count">0 points</span>
    </div>
    <canvas id="plot"></canvas>
    <p class="small" style="margin:6px 0 0">Shaded bands show when DEP was on.</p>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>#</th><th>Time (s)</th><th>I (µA)</th><th>R</th><th>ΔR</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="row" style="margin-top:10px">
      <button id="saveBtn" disabled>Save / share CSV</button>
      <button id="copyBtn" disabled>Copy CSV</button>
      <button id="clearBtn">Clear</button>
    </div>
  </div>

  <div class="card"><div id="log"></div></div>
</section>

<!-- ============ SETTINGS TAB ============ -->
<section id="settingsPane" hidden>
  <div class="card">
    <div class="row">
      <button id="readBtn" disabled>Read from device</button>
      <button id="sendBtn" class="primary" disabled>Send to device</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="defaultsBtn" disabled>Reset to defaults</button>
    </div>
    <p class="small" id="settingsMsg" style="margin:8px 0 0"></p>
  </div>

  <div class="card">
    <div id="fieldsMain"></div>
    <h2>Measurement (advanced)</h2>
    <div id="fieldsAdv"></div>
    <p class="small" id="estimate" style="margin:10px 0 0"></p>
  </div>
</section>

<script>
const NUS    = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const NUS_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";   // write to device
const NUS_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";   // notifications from device

// Must match the parameter table in the sketch.
const PARAMS = [
  { key: "cycles",   label: "DEP cycles",                      unit: "",   min: 1, max: 50,      def: 6,    group: "main", help: "Number of DEP + measurement repeats." },
  { key: "dep_s",    label: "DEP duration",                    unit: "s",  min: 1, max: 600,     def: 10,   group: "main", help: "Time the function generator is on each cycle." },
  { key: "settle_s", label: "Settling time after DEP",         unit: "s",  min: 0, max: 60,      def: 1,    group: "main", help: "Generator off, then wait this long before measuring." },
  { key: "pre_s",    label: "Delay before baseline",           unit: "s",  min: 0, max: 600,     def: 0,    group: "main", help: "Time to let the sample settle before the first measurement." },
  { key: "e_mv",     label: "Measurement potential",           unit: "mV", min: 1, max: 500,     def: 50,   group: "adv",  help: "Small DC bias used to measure resistance (R = E / I). Keep low to limit electrolysis." },
  { key: "run_ms",   label: "Measurement duration",            unit: "ms", min: 100, max: 20000, def: 1000, group: "adv",  help: "Length of each chronoamperometry trace." },
  { key: "int_ms",   label: "Sampling interval",               unit: "ms", min: 10, max: 5000,   def: 50,   group: "adv",  help: "Time between current samples." },
  { key: "avg_pct",  label: "Averaging window (end of trace)", unit: "%",  min: 10, max: 100,    def: 50,   group: "adv",  help: "Current is averaged over this last part of the trace to skip the charging transient." },
  { key: "rmin_nA",  label: "Min current range",               unit: "nA", min: 1, max: 1000000, def: 100,  group: "adv",  help: "Autorange lower limit. Must be a range the Pico supports." },
  { key: "rmax_uA",  label: "Max current range",               unit: "µA", min: 1, max: 5000,    def: 1000, group: "adv",  help: "Autorange upper limit. Must be a range the Pico supports." },
];
const values = {};
PARAMS.forEach(p => values[p.key] = p.def);

const $ = id => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
let device = null, rxChar = null, txChar = null, wakeLock = null, rxBuffer = "";

let results = [];      // {idx, t, I, R, n}
let deps = [];         // {k, s, e}  e = null while running
let run = { active: false, cycles: 0, depDur: 0, stageText: "Idle", stageEnd: 0, stageKind: "" };

// ---------- helpers ----------
function log(msg) { const el = $("log"); el.textContent += msg + "\n"; el.scrollTop = el.scrollHeight; }
function setState(text, on) { $("state").textContent = text; $("dot").classList.toggle("on", !!on); }
function connected() { return device && device.gatt.connected; }
function fmtR(r) {
  if (!(r > 0)) return "–";
  if (r >= 1e6) return (r / 1e6).toFixed(3) + " MΩ";
  if (r >= 1e3) return (r / 1e3).toFixed(2) + " kΩ";
  return r.toFixed(1) + " Ω";
}
function fmtClock(s) {
  s = Math.max(0, Math.round(s));
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}
function updateButtons() {
  const c = connected(), r = run.active;
  $("startBtn").disabled = !c || r;
  $("stopBtn").disabled = !c || !r;
  $("readBtn").disabled = !c || r;
  $("sendBtn").disabled = !c || r;
  $("defaultsBtn").disabled = !c || r;
  $("connectBtn").textContent = c ? "Disconnect" : "Connect";
}

// ---------- Bluetooth ----------
async function connect() {
  if (!navigator.bluetooth) { setState("Web Bluetooth unavailable. Open this page in Bluefy.", false); return; }
  try {
    setState("Scanning…", false);
    device = await navigator.bluetooth.requestDevice({ filters: [{ services: [NUS] }], optionalServices: [NUS] });
    device.addEventListener("gattserverdisconnected", onDisconnected);
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(NUS);
    rxChar = await svc.getCharacteristic(NUS_RX);
    txChar = await svc.getCharacteristic(NUS_TX);
    txChar.addEventListener("characteristicvaluechanged", onNotify);
    await txChar.startNotifications();
    setState("Connected to " + (device.name || "device"), true);
    updateButtons();
    requestWakeLock();
    await send("GET\n");                        // load current settings from the device
  } catch (err) {
    setState("Connection failed: " + err.message, false);
    updateButtons();
  }
}
function onDisconnected() {
  setState("Disconnected", false);
  if (run.active) { run.active = false; setStage("Connection lost during run"); }
  updateButtons();
  releaseWakeLock();
}
async function send(text) {
  const bytes = enc.encode(text);
  try { await rxChar.writeValueWithoutResponse(bytes); }
  catch (_) { await rxChar.writeValue(bytes); }
}
async function requestWakeLock() { try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (_) {} }
function releaseWakeLock() { try { if (wakeLock) wakeLock.release(); } catch (_) {} wakeLock = null; }

// ---------- Incoming messages ----------
function onNotify(ev) {
  rxBuffer += dec.decode(ev.target.value.buffer, { stream: true });
  let i;
  while ((i = rxBuffer.indexOf("\n")) >= 0) {
    const line = rxBuffer.slice(0, i).trim();
    rxBuffer = rxBuffer.slice(i + 1);
    if (line) handleLine(line);
  }
}
function setStage(text, durSec, kind) {
  run.stageText = text;
  run.stageKind = kind || "";
  run.stageEnd = durSec ? Date.now() + durSec * 1000 : 0;
  renderStage();
}
function renderStage() {
  let t = run.stageText;
  if (run.stageEnd) t += " – " + fmtClock((run.stageEnd - Date.now()) / 1000) + " left";
  $("stage").textContent = t;
}
function handleLine(line) {
  const parts = line.split(/\s+/);
  const tag = parts[0];
  switch (tag) {
    case "#": log(line.replace(/^#\s*/, "")); break;
    case "PAR": setValue(parts[1], Number(parts[2])); break;
    case "RUNSTART":
      results = []; deps = [];
      run.active = true; run.cycles = +parts[1]; run.depDur = +parts[2];
      $("barfill").style.width = "0%";
      setState("Running", true); setStage("Starting…");
      updateButtons(); renderResults(); draw();
      break;
    case "STAGE":
      if (parts[1] === "wait")        setStage("Waiting before baseline", +parts[2], "wait");
      else if (parts[1] === "measure") setStage(+parts[2] === 0 ? "Baseline measurement" : `Measurement ${parts[2]} of ${run.cycles}`, 0, "measure");
      else if (parts[1] === "dep") {
        deps.push({ k: +parts[2], s: +parts[4], e: null });
        setStage(`DEP ${parts[2]} of ${run.cycles}`, +parts[3], "dep");
      }
      else if (parts[1] === "settle")  setStage(`Settling ${parts[2]} of ${run.cycles}`, +parts[3], "settle");
      break;
    case "DEP": {
      const d = deps.find(x => x.k === +parts[1]);
      if (d) { d.s = +parts[2]; d.e = +parts[3]; } else deps.push({ k: +parts[1], s: +parts[2], e: +parts[3] });
      draw();
      break;
    }
    case "RES":
      results.push({ idx: +parts[1], t: +parts[2], I: +parts[3], R: +parts[4], n: +parts[5] });
      $("barfill").style.width = (100 * results.length / (run.cycles + 1)) + "%";
      renderResults(); draw();
      break;
    case "DONE":
      run.active = false; setStage("Done"); setState("Finished", true); updateButtons(); draw(); break;
    case "ABORTED":
      run.active = false; setStage("Aborted"); setState("Aborted", true); updateButtons(); draw(); break;
    default: log(line);
  }
}

// ---------- Results ----------
function deltaPct(r) {
  const base = results.length ? results[0].R : 0;
  return base > 0 && r.R > 0 ? (r.R - base) / base * 100 : NaN;
}
function renderResults() {
  $("count").textContent = results.length + (results.length === 1 ? " point" : " points");
  $("rows").innerHTML = results.map(r => {
    const d = deltaPct(r);
    return `<tr><td>${r.idx === 0 ? "base" : r.idx}</td><td>${r.t.toFixed(1)}</td><td>${r.I.toFixed(3)}</td><td>${fmtR(r.R)}</td><td>${Number.isFinite(d) ? (d >= 0 ? "+" : "") + d.toFixed(1) + "%" : "–"}</td></tr>`;
  }).join("");
  $("saveBtn").disabled = $("copyBtn").disabled = results.length === 0;
}

// ---------- Plot ----------
function niceTicks(min, max, n = 5) {
  if (min === max) { min -= 1; max += 1; }
  const step0 = (max - min) / n, mag = Math.pow(10, Math.floor(Math.log10(step0))), norm = step0 / mag;
  const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
  const out = [];
  for (let v = Math.ceil(min / step) * step; v <= max + step * 1e-6; v += step) out.push(v);
  return out;
}
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function draw() {
  const canvas = $("plot");
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  const fg = cssVar("--fg"), muted = cssVar("--muted"), grid = cssVar("--line");
  const accent = cssVar("--accent"), band = cssVar("--band");
  const m = { l: 58, r: 12, t: 12, b: 38 };
  const pw = w - m.l - m.r, ph = h - m.t - m.b;

  const metric = $("metric").value;
  let ys = [], yLabel = "", yFmt = v => String(v);
  if (metric === "R") {
    const maxR = Math.max(0, ...results.map(r => r.R));
    const [div, unit] = maxR >= 1e6 ? [1e6, "MΩ"] : maxR >= 1e3 ? [1e3, "kΩ"] : [1, "Ω"];
    ys = results.map(r => r.R > 0 ? r.R / div : NaN);
    yLabel = `Resistance (${unit})`;
  } else if (metric === "dR") {
    ys = results.map(deltaPct);
    yLabel = "Change in resistance (%)";
  } else {
    ys = results.map(r => r.I);
    yLabel = "Current (µA)";
  }
  const xs = results.map(r => r.t);

  const nowRel = results.length || deps.length ? Math.max(...xs, ...deps.map(d => d.e ?? d.s), 0) : 0;
  const openDep = deps.find(d => d.e === null);
  let xmax = Math.max(nowRel, ...xs, 1);
  if (openDep && run.active) xmax = Math.max(xmax, openDep.s + run.depDur);
  let xmin = 0;

  const fin = ys.filter(Number.isFinite);
  let ymin = fin.length ? Math.min(...fin) : 0, ymax = fin.length ? Math.max(...fin) : 1;
  if (metric === "dR") { ymin = Math.min(ymin, 0); ymax = Math.max(ymax, 0); }
  const pad = (ymax - ymin) * 0.12 || Math.abs(ymax) * 0.1 || 1;
  ymin -= pad; ymax += pad;

  const X = v => m.l + (v - xmin) / (xmax - xmin) * pw;
  const Y = v => m.t + (1 - (v - ymin) / (ymax - ymin)) * ph;

  // DEP bands
  ctx.fillStyle = band; ctx.globalAlpha = 0.22;
  for (const d of deps) {
    const end = d.e ?? Math.min(d.s + run.depDur, d.s + (Date.now() - run.depStartMs) / 1000 || d.s);
    ctx.fillRect(X(d.s), m.t, Math.max(1, X(end) - X(d.s)), ph);
  }
  ctx.globalAlpha = 1;

  // grid + ticks
  ctx.font = "11px -apple-system, system-ui, sans-serif";
  ctx.lineWidth = 1; ctx.strokeStyle = grid; ctx.fillStyle = muted;
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (const t of niceTicks(xmin, xmax, 5)) {
    ctx.beginPath(); ctx.moveTo(X(t), m.t); ctx.lineTo(X(t), m.t + ph); ctx.stroke();
    ctx.fillText(String(Math.round(t * 10) / 10), X(t), m.t + ph + 4);
  }
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (const t of niceTicks(ymin, ymax, 5)) {
    ctx.beginPath(); ctx.moveTo(m.l, Y(t)); ctx.lineTo(m.l + pw, Y(t)); ctx.stroke();
    ctx.fillText(String(Math.round(t * 1000) / 1000), m.l - 6, Y(t));
  }
  ctx.fillStyle = fg; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
  ctx.fillText("Time (s)", m.l + pw / 2, h - 2);
  ctx.save(); ctx.translate(12, m.t + ph / 2); ctx.rotate(-Math.PI / 2);
  ctx.textBaseline = "top"; ctx.fillText(yLabel, 0, 0); ctx.restore();

  // data
  ctx.strokeStyle = accent; ctx.fillStyle = accent; ctx.lineWidth = 2;
  ctx.beginPath();
  let started = false;
  results.forEach((r, i) => {
    if (!Number.isFinite(ys[i])) return;
    if (!started) { ctx.moveTo(X(xs[i]), Y(ys[i])); started = true; } else ctx.lineTo(X(xs[i]), Y(ys[i]));
  });
  ctx.stroke();
  results.forEach((r, i) => {
    if (!Number.isFinite(ys[i])) return;
    ctx.beginPath(); ctx.arc(X(xs[i]), Y(ys[i]), 4, 0, Math.PI * 2); ctx.fill();
  });
}

// ---------- Export ----------
function csvText() {
  const base = results.length ? results[0].R : 0;
  const rows = results.map(r => [r.idx, r.t, r.I, r.R, base > 0 && r.R > 0 ? ((r.R - base) / base * 100).toFixed(3) : ""].join(","));
  return "measurement,time_s,current_uA,resistance_ohm,delta_R_pct\n" + rows.join("\n") + "\n";
}
function csvName() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return `dep_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.csv`;
}
async function saveCsv() {
  const name = csvName();
  const file = new File([csvText()], name, { type: "text/csv" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (_) {}
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
async function copyCsv() {
  try { await navigator.clipboard.writeText(csvText()); log("CSV copied to clipboard"); }
  catch (e) { log("Copy failed: " + e.message); }
}

// ---------- Settings tab ----------
function buildFields() {
  for (const p of PARAMS) {
    const wrap = document.createElement("div");
    wrap.className = "field";
    wrap.innerHTML = `<label for="f_${p.key}">${p.label}</label>
      <input id="f_${p.key}" type="number" inputmode="numeric" min="${p.min}" max="${p.max}" step="1" value="${p.def}">
      <span class="unit">${p.unit}</span>
      <span class="help">${p.help} (${p.min}–${p.max})</span>`;
    (p.group === "main" ? $("fieldsMain") : $("fieldsAdv")).appendChild(wrap);
    wrap.querySelector("input").addEventListener("input", e => {
      const v = parseInt(e.target.value, 10);
      if (Number.isFinite(v)) values[p.key] = v;
      updateEstimate();
    });
  }
  updateEstimate();
}
function setValue(key, v) {
  if (!(key in values) || !Number.isFinite(v)) return;
  values[key] = v;
  const el = $("f_" + key);
  if (el) el.value = v;
  updateEstimate();
}
function updateEstimate() {
  const v = values;
  const perMeas = v.run_ms / 1000 + 2;            // ~2 s of script overhead per measurement
  const total = v.pre_s + (v.cycles + 1) * perMeas + v.cycles * (v.dep_s + v.settle_s);
  $("estimate").textContent = `Estimated run time ≈ ${fmtClock(total)} (${v.cycles + 1} measurements, ${v.cycles} × ${v.dep_s} s DEP).`;
}
function readInputs() {
  const out = {};
  for (const p of PARAMS) {
    let v = parseInt($("f_" + p.key).value, 10);
    if (!Number.isFinite(v)) v = p.def;
    v = Math.min(p.max, Math.max(p.min, v));
    out[p.key] = v;
    $("f_" + p.key).value = v;
  }
  return out;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function sendSettings() {
  const vals = readInputs();
  $("settingsMsg").textContent = "Sending…";
  try {
    for (const p of PARAMS) { await send(`SET ${p.key} ${vals[p.key]}\n`); await sleep(120); }
    $("settingsMsg").textContent = "Settings saved to the device.";
  } catch (e) { $("settingsMsg").textContent = "Send failed: " + e.message; }
}

// ---------- Tabs & wiring ----------
function showTab(name) {
  $("runPane").hidden = name !== "run";
  $("settingsPane").hidden = name !== "settings";
  $("tabRun").classList.toggle("active", name === "run");
  $("tabSettings").classList.toggle("active", name === "settings");
  if (name === "run") draw();
}
$("tabRun").addEventListener("click", () => showTab("run"));
$("tabSettings").addEventListener("click", () => showTab("settings"));
$("connectBtn").addEventListener("click", () => (connected() ? device.gatt.disconnect() : connect()));
$("startBtn").addEventListener("click", async () => {
  if (results.length && !confirm("Clear the existing data and start a new run?")) return;
  results = []; deps = []; renderResults(); draw();
  try { await send("START\n"); setStage("Starting…"); } catch (e) { setState("Send failed: " + e.message, true); }
});
$("stopBtn").addEventListener("click", async () => { try { await send("STOP\n"); } catch (_) {} });
$("readBtn").addEventListener("click", async () => { $("settingsMsg").textContent = "Reading…"; await send("GET\n"); setTimeout(() => $("settingsMsg").textContent = "Loaded from device.", 600); });
$("sendBtn").addEventListener("click", sendSettings);
$("defaultsBtn").addEventListener("click", async () => { await send("DEFAULTS\n"); $("settingsMsg").textContent = "Defaults restored."; });
$("saveBtn").addEventListener("click", saveCsv);
$("copyBtn").addEventListener("click", copyCsv);
$("clearBtn").addEventListener("click", () => { results = []; deps = []; renderResults(); draw(); });
$("metric").addEventListener("change", draw);
window.addEventListener("resize", draw);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && connected()) requestWakeLock(); });

// Countdown + growing DEP band
setInterval(() => {
  if (run.stageEnd) renderStage();
  if (run.stageKind === "dep") draw();
}, 500);

buildFields();
renderResults();
updateButtons();
draw();
</script>
</body>
</html>
